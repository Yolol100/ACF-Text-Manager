name: One-shot compatibility metadata sync

on:
  push:
    branches:
      - maintenance/wp-7-1-2026-09-09

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply exact metadata replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('readme.txt')
          text = path.read_text(encoding='utf-8')
          old = 'Tested up to: 7.0'
          new = 'Tested up to: 7.1'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add readme.txt
          git rm .github/workflows/one-shot-doc-sync.yml
          git commit -m 'docs: sync WordPress 7.1 compatibility metadata'
          git push origin HEAD:maintenance/wp-7-1-2026-09-09
